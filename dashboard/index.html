<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/overview" aria-label="Node Market home">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="7.5" cy="12" r="1.3"/><path d="M11 12h6"/>
        </svg>
        <span>Node Market</span>
      </a>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search-input" type="search" placeholder="Search listings, e.g. M720q or i5-8500T" aria-label="Search listings">
      </form>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/overview" data-tab="overview">Overview</a>
      <a href="#/mini_pc" data-tab="mini_pc">Mini PC</a>
      <a href="#/ram" data-tab="ram">RAM</a>
      <a href="#/cpu" data-tab="cpu">CPU</a>
      <a href="#/runs" data-tab="runs">Runs</a>
    </nav>
  </header>

  <main id="view" class="page" tabindex="-1"></main>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="drawer__close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
